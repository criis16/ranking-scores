services:
  app:
    build:
      context: ./docker
    image: ranking-scores-app:latest
    working_dir: /var/www/html
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./src:/var/www/html
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: laravel
      DB_USERNAME: laravel
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        if [ ! -f artisan ]; then
          composer create-project laravel/laravel:^13.0 .
        fi
        php artisan migrate --force
        php artisan serve --host=0.0.0.0 --port=8000 --no-reload

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: laravel
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d laravel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
